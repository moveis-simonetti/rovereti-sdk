version: "2"
services:
  php-cli:
    image: lojassimonetti/php-apache-oci8-composer:php${PHP_VERSION:-8dot1}
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - http_proxy=${http_proxy:-}
      - no_proxy=${no_proxy:-}
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/app
